<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' nexus-asset:; img-src 'self' nexus-asset: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';" />
  <title>NEXUS LIVE</title>
  <link rel="stylesheet" href="css/nexus.css" />
  <style>
    body { overflow: hidden; }
    #live { display: flex; flex-direction: column; height: 100vh; }
    .live-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; -webkit-app-region: drag; border-bottom: 1px solid var(--line); background: rgba(10,20,40,0.9); }
    .live-bar .t { font-family: var(--font-display); font-weight: 700; letter-spacing: 2px; font-size: 12px; color: var(--gold-bright); }
    .live-bar .sp { flex: 1; }
    .live-bar button, .live-bar input { -webkit-app-region: no-drag; }
    .live-body { flex: 1; overflow-y: auto; padding: 10px; }
    .live-row { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 8px; margin-bottom: 4px; border: 1px solid var(--line); cursor: pointer; }
    .live-row:hover { background: var(--teal-dim); }
    .live-row img { width: 30px; height: 30px; border-radius: 6px; }
    .live-row .nm { flex: 1; min-width: 0; font-size: 12px; }
    .live-row .nm b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .live-row .nm span { color: var(--text-3); font-size: 10px; }
    .live-side { font-family: var(--font-display); font-size: 10px; letter-spacing: 1px; margin: 8px 0 4px; }
    .op-slider { width: 70px; }
  </style>
</head>
<body>
  <div id="live">
    <div class="live-bar">
      <span class="t">NEXUS LIVE</span>
      <span class="sp"></span>
      <input type="range" class="op-slider" id="op" min="30" max="100" value="96" title="透明度" />
      <button class="win-btn" id="focus-main" title="打开主窗口"></button>
      <button class="win-btn close" id="close-live" title="关闭"></button>
    </div>
    <div class="live-body" id="live-body"></div>
  </div>
  <script type="module" src="js/live.js"></script>
</body>
</html>
