<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' nexus-asset:; img-src 'self' nexus-asset: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' nexus-asset:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS · 英雄联盟智能战术终端</title>
  <link rel="stylesheet" href="css/nexus.css" />
</head>
<body>
  <div id="app">
    <header class="titlebar">
      <div class="brand">
        <svg class="logo-mark" viewBox="0 0 24 24" fill="none">
          <path d="M12 2 3 7v10l9 5 9-5V7z" stroke="#C8AA6E" stroke-width="1.3"/>
          <path d="M12 6 7 9v6l5 3 5-3V9z" fill="#0AC8B9" fill-opacity="0.18" stroke="#0AC8B9" stroke-width="1.1"/>
          <circle cx="12" cy="12" r="2" fill="#F0E6D2"/>
        </svg>
        <span class="brand-name">NEXUS</span>
        <span class="brand-sub">英雄联盟智能战术终端</span>
      </div>
      <div class="spacer"></div>
      <div class="win-controls">
        <button class="win-btn" id="win-min" title="最小化"></button>
        <button class="win-btn" id="win-max" title="最大化"></button>
        <button class="win-btn close" id="win-close" title="关闭"></button>
      </div>
    </header>
    <div class="shell">
      <nav class="sidebar" id="sidebar"></nav>
      <div class="main">
        <div class="topbar" id="topbar"></div>
        <main class="view" id="view"><div class="view-inner" id="view-inner"></div></main>
      </div>
    </div>
  </div>
  <div id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
